
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Peeps Only</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #fafafa;
  color: #262626;
}

.app {
  display: flex;
  height: 100vh;
  max-width: 1200px;
  margin: auto;
  background: white;
  border-left: 1px solid #eee;
  border-right: 1px solid #eee;
}

.sidebar {
  width: 350px;
  border-right: 1px solid #eee;
  display: flex;
  flex-direction: column;
}

.brand {
  padding: 25px 20px;
  font-size: 25px;
  font-weight: bold;
  background: linear-gradient(45deg,#fd5949,#d6249f,#285AEB);
  background-clip: text;
  color: transparent;
}

.profile {
  padding: 15px 20px;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(45deg,#ff9966,#ff5e62,#c850c0);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  flex-shrink: 0;
}

.profile small {
  color: #888;
}

.section-title {
  display: flex;
  justify-content: space-between;
  padding: 20px;
  font-weight: bold;
}

.contact-list {
  overflow-y: auto;
  flex: 1;
}

.contact {
  padding: 14px 18px;
  display: flex;
  gap: 12px;
  align-items: center;
  cursor: pointer;
}

.contact:hover,
.contact.active {
  background: #f5f5f5;
}

.contact-info {
  min-width: 0;
  flex: 1;
}

.contact-info p {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.add-contact {
  padding: 15px;
  border: 0;
  border-top: 1px solid #eee;
  background: white;
  color: #d62976;
  font-weight: bold;
  cursor: pointer;
}

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-header {
  padding: 16px;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 78px;
}

.chat-header small {
  color: #888;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 20px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.sent {
  align-self: flex-end;
  background: linear-gradient(45deg,#ff5e91,#c850c0);
  color: white;
  border-bottom-right-radius: 5px;
}

.received {
  align-self: flex-start;
  background: #efefef;
  border-bottom-left-radius: 5px;
}

.time {
  font-size: 10px;
  margin-top: 5px;
  opacity: .7;
}

.input-area {
  padding: 15px;
  border-top: 1px solid #eee;
  display: flex;
  gap: 10px;
}

.input-area input {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 25px;
  padding: 13px 17px;
  outline: none;
  min-width: 0;
}

.send {
  border: none;
  padding: 0 20px;
  border-radius: 25px;
  color: white;
  background: linear-gradient(45deg,#ff5e91,#c850c0);
  font-weight: bold;
  cursor: pointer;
}

button {
  cursor: pointer;
}

.empty {
  margin: auto;
  text-align: center;
  color: #999;
  padding: 20px;
}

.new-chat {
  border: none;
  background: none;
  color: #d62976;
  font-size: 20px;
}

@media(max-width:650px) {
  .sidebar {
    width: 100%;
    border: none;
  }

  .chat {
    display: none;
  }

  .app.chat-open .sidebar {
    display: none;
  }

  .app.chat-open .chat {
    display: flex;
    width: 100%;
  }

  .back {
    display: block !important;
  }
}

.back {
  display: none;
  border: none;
  background: none;
  font-size: 22px;
}
</style>
</head>

<body>
<div class="app" id="app">

  <aside class="sidebar">
    <div class="brand">Peeps Only ✨</div>

    <div class="profile">
      <div class="avatar">P</div>
      <div>
        <strong id="myName">Your Profile</strong>
        <br><small>My account</small>
      </div>
    </div>

    <div class="section-title">
      <span>Messages</span>
      <button class="new-chat" onclick="addContact()">＋</button>
    </div>

    <div class="contact-list" id="contacts"></div>

    <button class="add-contact" onclick="addContact()">
      + Add a new contact
    </button>
  </aside>

  <main class="chat">
    <div class="chat-header" id="chatHeader">
      <div class="empty">
        <h2>Welcome to Peeps Only 💗</h2>
        <p>Select a conversation to start chatting.</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty">
        <h2>💬</h2>
        <p>Your conversations will appear here.</p>
      </div>
    </div>

    <form class="input-area" id="messageForm">
      <input id="messageInput"
        placeholder="Message..."
        autocomplete="off">
      <button class="send" type="submit">Send</button>
    </form>
  </main>

</div>

<script>
const KEY = "peeps_only_data_v1";

let data = JSON.parse(localStorage.getItem(KEY) || "null") || {
  username: "Your Profile",
  contacts: []
};

let activeId = null;

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function initials(name) {
  return name.trim().split(/\s+/)
    .map(word => word[0])
    .join("")
    .slice(0,2).toUpperCase();
}

function getContact(id) {
  return data.contacts.find(c => c.id === id);
}

function addContact() {
  const name = prompt("Enter your friend's name:");
  if (!name || !name.trim()) return;

  const contact = {
    id: crypto.randomUUID(),
    name: name.trim(),
    messages: []
  };

  data.contacts.push(contact);
  save();
  renderContacts();
  openChat(contact.id);
}

function renderContacts() {
  const box = document.getElementById("contacts");
  box.innerHTML = "";

  data.contacts.forEach(contact => {
    const last = contact.messages.at(-1);

    const item = document.createElement("div");
    item.className = "contact" +
      (contact.id === activeId ? " active" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = initials(contact.name);

    const info = document.createElement("div");
    info.className = "contact-info";

    const name = document.createElement("strong");
    name.textContent = contact.name;

    const preview = document.createElement("p");
    preview.textContent = last ? last.text : "Start a conversation";

    info.append(name, preview);
    item.append(avatar, info);

    item.addEventListener("click", () => openChat(contact.id));
    box.append(item);
  });
}

function openChat(id) {
  activeId = id;
  const contact = getContact(id);
  if (!contact) return;

  document.getElementById("app").classList.add("chat-open");

  const header = document.getElementById("chatHeader");
  header.replaceChildren();

  const back = document.createElement("button");
  back.className = "back";
  back.textContent = "‹";
  back.onclick = () => {
    document.getElementById("app").classList.remove("chat-open");
  };

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = initials(contact.name);

  const info = document.createElement("div");
  const name = document.createElement("strong");
  name.textContent = contact.name;

  const status = document.createElement("small");
  status.textContent = "Offline chat";

  info.append(name, document.createElement("br"), status);
  header.append(back, avatar, info);

  renderMessages();
  renderContacts();
}

function renderMessages() {
  const box = document.getElementById("messages");
  box.replaceChildren();

  const contact = getContact(activeId);
  if (!contact) return;

  contact.messages.forEach(message => {
    const bubble = document.createElement("div");
    bubble.className = "message " +
      (message.sender === "me" ? "sent" : "received");

    const text = document.createElement("div");
    text.textContent = message.text;

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = message.time;

    bubble.append(text, time);
    box.append(bubble);
  });

  box.scrollTop = box.scrollHeight;
}

document.getElementById("messageForm")
.addEventListener("submit", event => {
  event.preventDefault();

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text || !activeId) return;

  const contact = getContact(activeId);

  contact.messages.push({
    sender: "me",
    text,
    time: new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    })
  });

  input.value = "";
  save();
  renderMessages();
  renderContacts();
});

function editProfile() {
  const name = prompt("What should your profile name be?",
    data.username);

  if (name && name.trim()) {
    data.username = name.trim();
    document.getElementById("myName").textContent =
      data.username;
    save();
  }
}

document.querySelector(".profile")
.addEventListener("click", editProfile);

document.getElementById("myName").textContent = data.username;

renderContacts();
save();
</script>
</body>
</html>
